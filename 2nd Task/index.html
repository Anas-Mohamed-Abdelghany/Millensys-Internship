<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-hospital me-2"></i>Patient Management System
      </span>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row g-4">
      <!-- Form Card -->
      <div class="col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white fw-bold">
            <i class="bi bi-person-plus me-1"></i><span id="formTitle">Add Patient</span>
          </div>
          <div class="card-body">
            <form id="patientForm">
              <input type="hidden" id="editId" value="">
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter patient name" required>
              </div>
              <div class="mb-3">
                <label for="age" class="form-label">Age</label>
                <input type="number" class="form-control" id="age" placeholder="Enter age" min="1" required>
              </div>
              <div class="mb-3">
                <label for="gender" class="form-label">Gender</label>
                <select class="form-select" id="gender" required>
                  <option value="" disabled selected>Select gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="condition" class="form-label">Condition</label>
                <input type="text" class="form-control" id="condition" placeholder="e.g. Hypertension, Diabetes" minlength="3" required>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-fill" id="addBtn">
                  <i class="bi bi-plus-circle me-1"></i>Add
                </button>
                <button type="button" class="btn btn-warning flex-fill d-none" id="updateBtn">
                  <i class="bi bi-arrow-repeat me-1"></i>Update
                </button>
                <button type="button" class="btn btn-secondary flex-fill d-none" id="cancelBtn">
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Table Card -->
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white fw-bold">
            <i class="bi bi-table me-1"></i>Patient Records
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-primary">
                  <tr>
                    <th>#ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Condition</th>
                    <th class="text-center">Actions</th>
                  </tr>
                </thead>
                <tbody id="patientTableBody">
                  <tr>
                    <td colspan="6" class="text-center text-muted py-4">No patients registered yet.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
